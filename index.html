<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">我的<span class="dot">博客</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">☾</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>记录日常，留一份温度</h1>
      <p>这里写所见、所读、所想。文章按时间倒序排列，可从目录直接跳转，或点击卡片阅读全文。</p>
    </section>

    <!-- JS 渲染失败时的退化展示（仅链接到示例文章） -->
    <noscript>
      <ul class="fallback-list">
        <li><a href="post.html?p=2026-10-05-system1">谁在接管你的系统1？——卡尼曼、Jev 与需求收割</a> — 2026年10月5日</li>

      </ul>
    </noscript>

    <div class="home-body">
      <div class="home-feed">
        <div id="status" class="status">正在加载文章…</div>
        <div id="post-list" class="post-list" aria-live="polite"></div>
      </div>

      <aside class="directory" id="directory" hidden>
        <details class="directory-panel" id="directory-panel">
          <summary class="directory-summary">
            <span class="directory-heading">
              <span id="directory-title">文章目录</span>
              <span class="directory-count" id="directory-count"></span>
            </span>
            <span class="directory-chevron" aria-hidden="true"></span>
          </summary>
          <div class="directory-body">
            <label class="directory-search">
              <span class="visually-hidden">搜索文章</span>
              <input id="directory-search" type="search" placeholder="搜索标题或标签" autocomplete="off" autocapitalize="off" spellcheck="false">
            </label>
            <nav id="directory-list" class="directory-list" aria-label="文章目录"></nav>
          </div>
        </details>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> 我的博客 · 由静态站点驱动</div>
    <div id="busuanzi_container_site_pv" class="visit-count" style="display:none">本站总访问量 <span id="busuanzi_value_site_pv"></span> 次 · 访客 <span id="busuanzi_value_site_uv"></span> 人</div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
