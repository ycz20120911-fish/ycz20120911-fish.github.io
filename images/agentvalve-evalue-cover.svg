    <circle cx="688" cy="480" r="15"/>
    <circle cx="688" cy="690" r="15"/>
  </g>
  <g fill="#ccfbf1">
    <circle cx="688" cy="270" r="5.5"/>
    <circle cx="688" cy="480" r="5.5"/>
    <circle cx="688" cy="690" r="5.5"/>
  </g>

  <use href="#faucet" x="1152" y="270"/>
  <use href="#faucet" x="1152" y="480"/>
  <use href="#faucet" x="1152" y="690"/>

  <g>
