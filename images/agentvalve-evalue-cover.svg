  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans CJK','WenQuanYi Micro Hei',sans-serif">
    <rect x="1124" y="64" width="360" height="74" rx="37" fill="#e07a5f"/>
    <text x="1304" y="101" text-anchor="middle" dominant-baseline="middle" font-size="36" font-weight="700" fill="#ffffff">水龙头 · 单笔</text>
