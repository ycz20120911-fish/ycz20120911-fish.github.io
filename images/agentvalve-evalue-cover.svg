      <circle cy="-54" r="7" fill="#e9b44c"/>
      <circle cx="-11" cy="2" r="3.5" fill="#ffffff"/>
      <circle cx="11" cy="2" r="3.5" fill="#ffffff"/>
      <path d="M-10 16 Q0 24 10 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(1364,792)">
      <circle r="64" fill="#ffffff"/>
      <circle r="58" fill="#fdf0d0"/>
      <circle cy="8" r="30" fill="#e9b44c"/>
      <line x1="0" y1="-22" x2="0" y2="-48" stroke="#c4922a" stroke-width="4" stroke-linecap="round"/>
      <circle cy="-54" r="7" fill="#0f766e"/>
      <circle cx="-11" cy="2" r="3.5" fill="#14213d"/>
      <circle cx="11" cy="2" r="3.5" fill="#14213d"/>
      <path d="M-10 16 Q0 24 10 16" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
