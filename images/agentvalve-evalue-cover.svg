    <path d="M96 452 C176 418 246 496 340 450 C410 416 468 456 504 436 L504 478 C450 508 380 458 310 492 C230 530 160 470 96 500 Z" fill="#99f6e4" opacity="0.9"/>
    <circle cx="180" cy="600" r="16" fill="#ccfbf1" opacity="0.5"/>
