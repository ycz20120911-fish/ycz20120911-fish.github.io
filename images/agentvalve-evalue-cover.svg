      <line x1="0" y1="-22" x2="0" y2="-48" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
      <circle cy="-54" r="7" fill="#e9b44c"/>
      <circle cx="-11" cy="2" r="3.5" fill="#ffffff"/>
      <circle cx="11" cy="2" r="3.5" fill="#ffffff"/>
