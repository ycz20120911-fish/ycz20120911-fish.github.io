    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity="0.07"/>
    </filter>
    <symbol id="faucet" overflow="visible">
      <rect x="-2" y="-32" width="56" height="64" rx="16" fill="#e07a5f"/>
      <rect x="10" y="-46" width="32" height="18" rx="7" fill="#c45c48"/>
