  <rect x="690" y="470" width="450" height="12" rx="6" fill="#99f6e4" opacity="0.9"/>
  <rect x="664" y="666" width="500" height="48" rx="24" fill="url(#pipe)"/>
  <rect x="690" y="680" width="450" height="12" rx="6" fill="#99f6e4" opacity="0.9"/>
  <g fill="#115e59">
