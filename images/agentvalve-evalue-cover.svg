    <line x1="118" y1="314" x2="172" y2="314" stroke-width="4"/>
    <line x1="118" y1="378" x2="154" y2="378" stroke-width="4"/>
    <line x1="118" y1="442" x2="172" y2="442" stroke-width="4"/>
    <line x1="118" y1="506" x2="154" y2="506" stroke-width="4"/>
    <line x1="118" y1="570" x2="172" y2="570" stroke-width="4"/>
