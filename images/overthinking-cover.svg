<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="思考 token 与正确率的示意图：正确率先升后降，约 64% 的思考 token 在见顶之后">
  <title>思考 token 与正确率</title>
  <desc>示意图。横轴为思考 token，纵轴为正确率。曲线较早达到峰值，其后略有回落。峰值右侧区域约占横轴的 64%，标注为约 64% 的思考 token 在见顶之后。</desc>
