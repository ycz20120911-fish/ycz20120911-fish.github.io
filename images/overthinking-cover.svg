    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf6"/>
      <stop offset="100%" stop-color="#e7f0e6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#2e7d32" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b5e20" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="96" r="180" fill="#2e7d32" fill-opacity="0.05"/>
  <circle cx="120" cy="820" r="140" fill="#2e7d32" fill-opacity="0.05"/>

