  <text x="72" y="124" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','WenQuanYi Micro Hei','Droid Sans Fallback',sans-serif" font-size="40" font-weight="700" fill="#1a2e1c">正确率随思考 token 的变化</text>
  <text x="72" y="162" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','WenQuanYi Micro Hei','Droid Sans Fallback',sans-serif" font-size="20" fill="#5d6d5f">先升后降：见顶之后继续想，正确率不再更高</text>

